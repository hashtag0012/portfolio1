<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="noirBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="hoodShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="40%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3a3a3"/>
      <stop offset="50%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <filter id="cinematic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background with Dark Grain Atmosphere -->
  <rect width="400" height="400" fill="url(#noirBg)"/>

  <!-- Subtle grid / tech matrix lines in background -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="50" y1="0" x2="50" y2="400"/><line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Masked Figure in Black Balaclava & Hooded Jacket -->
  <g id="figure" filter="url(#cinematic)">
    <!-- Broad Shoulders & Black Technical Jacket -->
    <path d="M 40,400 C 60,330 110,290 150,280 L 150,260 L 250,260 L 250,280 C 290,290 340,330 360,400 Z" fill="url(#hoodShade)" stroke="#262626" stroke-width="2"/>

    <!-- Jacket Zipper / Hardware Details -->
    <line x1="200" y1="280" x2="200" y2="400" stroke="#404040" stroke-width="3" stroke-dasharray="4,2"/>
    <!-- Metal Zipper Pull / Ring -->
    <circle cx="200" cy="290" r="5" fill="none" stroke="#d4d4d4" stroke-width="2"/>

    <!-- Hood Shape Surrounding Head -->
    <path d="M 120,270 C 100,220 100,120 140,85 C 170,60 230,60 260,85 C 300,120 300,220 280,270 Z" fill="#141414" stroke="#262626" stroke-width="2"/>
    
    <!-- Balaclava Base -->
    <path d="M 135,255 C 120,200 120,135 155,100 C 180,75 220,75 245,100 C 280,135 280,200 265,255 C 245,275 155,275 135,255 Z" fill="#0a0a0a"/>

    <!-- Eye Slit Opening (Horizontal Cutout Showing Eyes & Brow) -->
    <path d="M 148,155 C 148,155 170,148 200,148 C 230,148 252,155 252,155 C 255,178 245,192 200,192 C 155,192 145,178 148,155 Z" fill="url(#skinTone)" stroke="#000000" stroke-width="3"/>

    <!-- Nose Bridge Shadow across eye opening -->
    <path d="M 195,150 L 205,150 L 202,185 L 198,185 Z" fill="#525252" opacity="0.6"/>

    <!-- Eyes (Focused, High Contrast Monochromatic) -->
    <!-- Left Eye -->
    <g transform="translate(160, 158)">
      <!-- Eyebrow shadow -->
      <path d="M 0,2 Q 15,-4 30,0" stroke="#171717" stroke-width="3.5" fill="none"/>
      <!-- Sclera -->
      <path d="M 2,10 Q 15,2 28,10 Q 15,18 2,10 Z" fill="#f5f5f5"/>
      <!-- Iris & Pupil -->
      <circle cx="15" cy="10" r="5" fill="#171717"/>
      <circle cx="15" cy="10" r="2.5" fill="#0a0a0a"/>
      <circle cx="17" cy="8" r="1.5" fill="#ffffff"/>
      <!-- Upper & lower eyeliner -->
      <path d="M 0,10 Q 15,2 30,10" stroke="#0a0a0a" stroke-width="2.5" fill="none"/>
      <path d="M 2,10 Q 15,18 28,10" stroke="#404040" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(210, 158)">
      <!-- Eyebrow shadow -->
      <path d="M 0,0 Q 15,-4 30,2" stroke="#171717" stroke-width="3.5" fill="none"/>
      <!-- Sclera -->
      <path d="M 2,10 Q 15,2 28,10 Q 15,18 2,10 Z" fill="#f5f5f5"/>
      <!-- Iris & Pupil -->
      <circle cx="15" cy="10" r="5" fill="#171717"/>
      <circle cx="15" cy="10" r="2.5" fill="#0a0a0a"/>
      <circle cx="17" cy="8" r="1.5" fill="#ffffff"/>
      <!-- Upper & lower eyeliner -->
      <path d="M 0,10 Q 15,2 30,10" stroke="#0a0a0a" stroke-width="2.5" fill="none"/>
      <path d="M 2,10 Q 15,18 28,10" stroke="#404040" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Upper Lip / Nose bridge mask seams -->
    <path d="M 148,155 Q 200,146 252,155" stroke="#1c1917" stroke-width="4" fill="none"/>
    <path d="M 145,185 Q 200,196 255,185" stroke="#1c1917" stroke-width="4" fill="none"/>

    <!-- Gloved Hands Raised Adjusting Balaclava (Iconic Pose) -->
    <!-- Left Hand / Fingers on Mask Edge -->
    <g transform="translate(100, 120)">
      <!-- Thumb & Fingers -->
      <path d="M 25,30 C 25,20 35,15 45,25 L 48,55 C 38,60 25,50 25,30 Z" fill="#1f1f1f" stroke="#404040" stroke-width="1.5"/>
      <path d="M 15,40 C 15,30 25,28 35,38 L 40,65 C 30,70 15,60 15,40 Z" fill="#171717" stroke="#404040" stroke-width="1.5"/>
      <path d="M 8,55 C 8,45 18,42 28,52 L 32,75 C 22,80 8,72 8,55 Z" fill="#171717" stroke="#404040" stroke-width="1.5"/>
      <!-- Knuckles highlight -->
      <circle cx="35" cy="30" r="3" fill="#525252"/>
      <circle cx="25" cy="42" r="3" fill="#525252"/>
    </g>

    <!-- Right Hand / Fingers on Right Mask Edge -->
    <g transform="translate(255, 120)">
      <!-- Thumb & Fingers -->
      <path d="M 20,25 C 30,15 40,20 40,30 L 40,55 C 27,50 14,60 20,25 Z" fill="#1f1f1f" stroke="#404040" stroke-width="1.5"/>
      <path d="M 30,38 C 40,28 50,30 50,40 L 50,65 C 35,60 20,70 30,38 Z" fill="#171717" stroke="#404040" stroke-width="1.5"/>
      <path d="M 38,52 C 48,42 58,45 58,55 L 58,75 C 43,72 29,80 38,52 Z" fill="#171717" stroke="#404040" stroke-width="1.5"/>
      <!-- Knuckles highlight -->
      <circle cx="30" cy="30" r="3" fill="#525252"/>
      <circle cx="40" cy="42" r="3" fill="#525252"/>
    </g>

    <!-- Foreground Mask Seams & Shadow Details -->
    <path d="M 175,200 Q 200,215 225,200" stroke="#000000" stroke-width="3" fill="none"/>
    <path d="M 200,210 L 200,265" stroke="#171717" stroke-width="2" fill="none"/>
  </g>
</svg>
